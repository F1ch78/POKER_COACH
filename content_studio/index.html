<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0b10">
<title>Студия контента</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0b10; --panel: #15151c; --panel2: #1d1e27; --line: #2a2b36; --fg: #e6e6ea; --muted: #8b8f9b;
    --gold: #d6a93c; --blue: #3aa0ff; --sel: #f4f4f7;
    --st-empty: #4a4c58; --st-wait: #3aa0ff; --st-ok: #3fb950; --st-fix: #e3b341; --st-redo: #f0524a; --fire: #d9531e; --moss: #4e7a4a; --warn: #3a2a12;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  button, .button { font: inherit; color: inherit; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  button:hover, .button:hover { border-color: #444656; }
  button:disabled { opacity: .5; cursor: default; }
  button.primary, .button.primary { background: var(--gold); color: #17130a; border-color: var(--gold); font-weight: 600; }
  button.ghost { background: transparent; }
  button.small { padding: 3px 8px; font-size: 13px; }
  button.big { padding: 12px 20px; font-size: 16px; }
  input, select, textarea { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; width: 100%; }
  textarea { resize: vertical; min-height: 38px; }
  input[type=checkbox], input[type=range] { width: auto; }
  select { width: auto; max-width: 100%; }
  h2 { font-size: 18px; margin: 28px 0 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  h2 small { font-weight: 400; color: var(--muted); font-size: 13px; }
  h3 { margin: 0 0 8px; font-size: 16px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .grow { flex: 1; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .row.wrap { flex-wrap: wrap; }
  .hidden { display: none !important; }

  header { position: sticky; top: 0; z-index: 5; display: flex; gap: 6px; align-items: center; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header select { max-width: 260px; }
  .brand { font-weight: 700; display: flex; align-items: center; gap: 8px; margin-right: 6px; }
  .sun { width: 18px; height: 18px; border-radius: 50%; background: #050507; box-shadow: 0 0 0 1.5px #e6f0ff, 0 0 8px rgba(220,235,255,.5); }
  nav { display: flex; gap: 4px; margin-left: auto; }
  .tab { background: transparent; border-color: transparent; }
  .tab.on { background: var(--panel2); border-color: var(--sel); color: var(--sel); }
  .busy { position: sticky; top: 52px; z-index: 4; background: var(--warn); color: #f4d48b; padding: 6px 16px; font-size: 14px; }

  .page { padding: 16px; max-width: 1400px; margin: 0 auto; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid2.tight { gap: 8px; margin-top: 8px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; min-width: 0; }
  .ok { color: #9fc49b; }
  dialog.settings { width: min(640px, calc(100vw - 32px)); max-height: 90vh; overflow: auto; }
  dialog h4 { margin: 18px 0 2px; font-size: 14px; color: var(--gold); border-top: 1px solid var(--line); padding-top: 12px; }
  input.num { width: 90px; padding: 4px 6px; }
  .pick-log { max-height: 160px; overflow: auto; font-size: 12px; margin-top: 6px; }
  .test-img { width: 100%; max-height: 220px; object-fit: contain; background: #000; border-radius: 8px; margin-top: 6px; }
  .genbar { position: sticky; top: 52px; z-index: 4; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 6px 16px; background: #1f1b12; border-bottom: 1px solid #5b4520; font-size: 14px; }
  .genbar .bar { min-width: 120px; }
  .genbar details { font-size: 13px; }
  .chip.gen { border-color: #5b4520; color: var(--gold); }
  .variants { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
  .variant { padding: 0; width: 120px; height: 68px; overflow: hidden; }
  .variant { position: relative; }
  .vbadge { position: absolute; right: 4px; bottom: 2px; font-size: 12px; }
  .variant img { width: 100%; height: 100%; object-fit: cover; }
  .mono { font: 12px/1.4 ui-monospace, monospace; }
  dialog.manual { width: min(720px, calc(100vw - 32px)); }
  dialog ol { padding-left: 20px; }
  .card.warn, .warn { background: var(--warn); border-color: #5b4520; border-radius: 10px; padding: 10px 14px; margin-top: 14px; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; flex: 1; min-width: 0; }
  .field > span { font-size: 12px; color: var(--muted); }
  .drop { border: 1.5px dashed #3a3c4a; border-radius: 12px; padding: 22px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; justify-content: center; background: var(--panel); }
  .over { outline: 2px solid var(--gold); outline-offset: 2px; }
  .list { display: flex; flex-direction: column; gap: 6px; }
  .item { display: flex; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; flex-wrap: wrap; }
  .badge { font-size: 12px; border-radius: 6px; padding: 2px 7px; background: var(--panel2); }
  .badge.script { color: var(--gold); } .badge.cast { color: var(--blue); } .badge.bible { color: #9fc49b; }
  .speaker { display: inline-flex; gap: 4px; align-items: center; margin: 4px 12px 4px 0; }
  .meter { display: flex; flex-direction: column; gap: 3px; margin-top: 8px; font-size: 13px; }
  .meter i, .bar { display: block; height: 5px; background: var(--panel2); border-radius: 3px; overflow: hidden; }
  .meter i b, .bar b { display: block; height: 100%; background: var(--gold); }
  .vo-scene, .snd-scene { margin-top: 14px; }
  .dev .card { margin-top: 14px; }
  .dev-step.done { border-left: 4px solid var(--st-ok); }
  .dev-refs { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin: 8px 0; }
  .dev-ref { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: grid; gap: 6px; align-content: start; min-width: 0; }
  .dev-ref-media img, .dev-ref-media video { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 6px; background: #000; display: block; }
  .dev-ref-media audio { width: 100%; }
  .dev-ref small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dev-ref.add { border-style: dashed; min-height: 120px; place-content: center; text-align: center; cursor: pointer; color: var(--fg); }
  .dev-timing { border-collapse: collapse; margin-top: 6px; } .dev-timing td, .dev-timing th { border-bottom: 1px solid var(--line); padding: 3px 10px; text-align: left; }
  .dev-timing tr.off td { color: var(--st-fix); }
  .dev-msg { border-top: 1px solid var(--line); padding: 8px 0; }
  .dev-answer { white-space: pre-wrap; }
  .experts .check { margin-right: 6px; }
  .crit { margin-top: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
  .crit summary { cursor: pointer; display: flex; gap: 8px; align-items: center; }
  .crit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; margin-top: 10px; }
  .crit-card { background: var(--panel2); border: 1px solid var(--line); border-left: 4px solid var(--st-empty); border-radius: 10px; padding: 10px 12px; }
  .crit-card ul { margin: 4px 0 8px; padding-left: 18px; }
  .crit-card.score-ok { border-left-color: var(--st-ok); } .crit-card.score-fix { border-left-color: var(--st-fix); } .crit-card.score-redo { border-left-color: var(--st-redo); }
  .crit-score { font-weight: 700; }
  .target select { max-width: 190px; }
  .target-note { margin-top: 2px; }
  .snd-lib { display: grid; gap: 6px; margin-top: 10px; }
  .snd-item { display: grid; grid-template-columns: 1fr auto 220px auto; gap: 8px; align-items: center; }
  .snd-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .snd-item audio { height: 30px; width: 220px; }
  .snd-cue { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
  .snd-cue .field { flex-direction: row; align-items: center; gap: 6px; }
  .snd-shot { display: grid; grid-template-columns: 80px 1fr minmax(260px, auto); gap: 10px; align-items: start; padding: 8px 0; border-top: 1px solid var(--line); }
  .snd-note { color: var(--gold); }
  .snd-fx { display: grid; gap: 6px; justify-items: start; }
  .vol { display: inline-flex; align-items: center; gap: 6px; }
  .vol input { width: 110px; }
  .secs { display: inline-flex; align-items: center; gap: 4px; }
  .secs input { width: 64px; }
  .mix { margin: 6px 0; }
  .mix-name { min-width: 90px; }
  .vo-row { display: grid; grid-template-columns: 80px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
  .vo-row audio { height: 30px; max-width: 220px; }
  .vo-cast .row { display: grid; grid-template-columns: 1fr auto auto auto; align-items: center; margin: 6px 0; }
  @media (max-width: 760px) { .vo-row, .vo-cast .row, .snd-shot, .snd-item { grid-template-columns: 1fr; } .snd-item audio { width: 100%; } }
  /* оценки: серый — пусто, синий — ждёт проверки, зелёный — готово, жёлтый — доработать, красный — переделать */
  .rv { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: transparent; border: 1px solid var(--st-empty); color: var(--muted); }
  .rv.sel { box-shadow: 0 0 0 1.5px var(--sel); }
  .rv-wait { border-color: var(--st-wait); color: var(--st-wait); } .rv-ok { border-color: var(--st-ok); color: var(--st-ok); }
  .rv-fix { border-color: var(--st-fix); color: var(--st-fix); } .rv-redo { border-color: var(--st-redo); color: var(--st-redo); }
  .rv-btn { font-size: 13px; padding: 4px 10px; background: transparent; }
  .rv-btn.on.rv-ok { background: var(--st-ok); color: #0b1a0f; } .rv-btn.on.rv-fix { background: var(--st-fix); color: #1d1606; } .rv-btn.on.rv-redo { background: var(--st-redo); color: #1f0807; }
  .review { margin-top: 8px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); border-left: 4px solid var(--st-empty); background: var(--panel2); display: grid; gap: 6px; }
  .review.rv-box-wait { border-left-color: var(--st-wait); } .review.rv-box-ok { border-left-color: var(--st-ok); }
  .review.rv-box-fix { border-left-color: var(--st-fix); } .review.rv-box-redo { border-left-color: var(--st-redo); }
  .rv-note { width: 100%; resize: vertical; }
  .rv-row { margin-top: 6px; }
  .vo-review { grid-column: 1 / -1; }
  .rv-now { margin-top: 10px; }
  .cnt.st-fix { color: var(--st-fix); } .cnt.st-redo { color: var(--st-redo); }
  .conv-item.st-ok { border-color: var(--st-ok); color: var(--st-ok); } .conv-item.st-wait { border-color: var(--st-wait); color: var(--st-wait); }
  .conv-item.st-fix { border-color: var(--st-fix); color: var(--st-fix); } .conv-item.st-redo { border-color: var(--st-redo); color: var(--st-redo); }
  .conv-item.st-empty { border-color: var(--st-empty); color: var(--muted); }
  .chip { font-size: 13px; padding: 3px 9px; border-radius: 999px; }
  .chip.on { background: #2a2b33; border-color: var(--sel); color: var(--sel); }
  .chip.warnchip { border-color: #6b5222; }
  button.x { padding: 0 5px; border: 0; background: transparent; color: var(--muted); }
  .ref { width: 86px; height: 86px; flex: none; border-radius: 10px; border: 1px dashed #3a3c4a; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; font-size: 12px; color: var(--muted); text-align: center; align-self: flex-start; }
  .ref img { width: 100%; height: 100%; object-fit: cover; }

  .board { display: grid; grid-template-columns: 280px 1fr; gap: 16px; padding: 16px; max-width: 1500px; margin: 0 auto; align-items: start; }
  .scenes { position: sticky; top: 64px; max-height: calc(100vh - 80px); overflow: auto; display: flex; flex-direction: column; gap: 4px; }
  .act { font-size: 12px; color: var(--muted); margin: 10px 4px 2px; text-transform: uppercase; letter-spacing: .04em; }
  .scene { display: block; text-align: left; width: 100%; padding: 8px 10px; }
  .scene small { display: block; color: var(--muted); font-size: 12px; margin: 2px 0 5px; }
  .scene.on { border-color: var(--sel); background: #24252d; }
  .scene-main { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .timing { padding: 5px 10px; border-radius: 8px; background: var(--panel2); font-size: 13px; align-self: flex-end; }
  .timing.off { color: #f0b46a; }
  .shift { font-size: 13px; color: #c5c9d3; flex-basis: 100%; }
  .notes { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .shot { display: grid; grid-template-columns: 240px 1fr; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 12px; padding: 10px; }
    .shot.st-empty { border-left-color: var(--st-empty); } .shot.st-wait { border-left-color: var(--st-wait); }
  .shot.st-ok { border-left-color: var(--st-ok); } .shot.st-fix { border-left-color: var(--st-fix); } .shot.st-redo { border-left-color: var(--st-redo); }
  .shot .body { min-width: 0; }
  .shot .body > .row:first-child { margin-top: 0; }
  .shot .body > textarea { margin-top: 6px; }
  .thumb { position: relative; aspect-ratio: 16 / 9; background: #08080c; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .thumb img, .thumb video { width: 100%; height: 100%; object-fit: cover; }
  .thumb .ph { color: var(--gold); font-size: 13px; opacity: .7; text-align: center; padding: 8px; }
  .thumb .code { position: absolute; left: 6px; top: 6px; font: 600 11px ui-monospace, monospace; background: rgba(0,0,0,.7); padding: 2px 6px; border-radius: 5px; }
  .dur { display: flex; align-items: center; gap: 4px; color: var(--muted); }
  .dur input { width: 72px; }
  .slot { font-size: 13px; padding: 3px 8px; }
  .slot.on { display: inline-flex; gap: 2px; align-items: center; border: 1px solid var(--moss); border-radius: 8px; background: #17201a; }
  .chars { margin-top: 6px; }
  .prompts textarea { font: 12px/1.4 ui-monospace, monospace; }

  .edit .stage { background: #000; border-radius: 12px; overflow: hidden; display: flex; justify-content: center; }
  .preview { width: 100%; height: auto; max-height: 70vh; object-fit: contain; display: block; }
  .transport { margin: 10px 0 16px; }
  .tc { font: 13px ui-monospace, monospace; color: var(--muted); white-space: nowrap; }
  .check { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; margin-right: 10px; }
  .rec-status { margin: 12px 0; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  .result { width: 100%; border-radius: 8px; }

  dialog { background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 14px; width: min(520px, calc(100vw - 32px)); padding: 18px; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  #toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 20; max-width: min(420px, calc(100vw - 32px)); }
  .toast { background: #23242e; border: 1px solid var(--line); border-left: 3px solid var(--gold); border-radius: 10px; padding: 10px 14px; box-shadow: 0 6px 20px rgba(0,0,0,.4); }

  .pill { font-size: 12px; color: var(--muted); background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; white-space: nowrap; }
  button.linkish { background: none; border: 0; padding: 0; color: var(--gold); text-decoration: underline; }
  .howto { margin-bottom: 14px; }
  .howto summary { cursor: pointer; font-weight: 600; }
  .howto ol { margin: 10px 0 6px; padding-left: 22px; display: grid; gap: 6px; }
  .filters { margin: 0; }
  .shot.focus { box-shadow: 0 0 0 2px var(--sel); }
  .thumb:has(img), .thumb:has(video) { cursor: zoom-in; }

  dialog.viewer { width: min(1200px, calc(100vw - 32px)); }
  .viewer-media { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .viewer-media img, .viewer-media video { width: 100%; max-height: 75vh; object-fit: contain; background: #000; border-radius: 8px; }

  .conv-top { margin: 0 0 14px; }
  .conv { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px; align-items: start; }
  .code-big { font: 700 20px ui-monospace, monospace; color: var(--gold); }
  .conv-text { font-size: 16px; margin: 10px 0; }
  .conv-dialogue { background: var(--bg); border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; font-size: 14px; }
  .conv-prompt { margin-top: 10px; font: 12.5px/1.45 ui-monospace, monospace; }
  .conv-side { display: flex; flex-direction: column; gap: 12px; position: sticky; top: 64px; }
  .conv-drop { position: relative; aspect-ratio: 16 / 9; border: 2px dashed #3a3c4a; border-radius: 12px; display: flex; align-items: center; justify-content: center; overflow: hidden; background: var(--panel); }
  .conv-drop.done { border-style: solid; border-color: var(--moss); }
  .conv-drop img, .conv-drop video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .55; }
  .conv-drop-hint { position: relative; text-align: center; padding: 12px; background: rgba(11,11,16,.75); border-radius: 10px; }
  .refs { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
  .refs figure { margin: 0; width: 120px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
  .refs img { width: 120px; height: 90px; object-fit: cover; border-radius: 8px; background: #000; }
  .conv-list { display: flex; flex-wrap: wrap; gap: 4px; max-height: 220px; overflow: auto; }
  .conv-item { font: 11px ui-monospace, monospace; padding: 3px 6px; }
  .conv-item.on { outline: 2px solid var(--sel); outline-offset: 1px; color: var(--sel); }

  .strip { position: relative; display: flex; height: 34px; margin: -6px 0 6px; border-radius: 6px; overflow: hidden; background: var(--panel2); cursor: pointer; }
  .blk { height: 100%; border-right: 1px solid var(--bg); position: relative; min-width: 1px; }
  .blk.st-empty { background: var(--st-empty); } .blk.st-wait { background: #24609a; } .blk.st-ok { background: #2c7a3c; }
  .blk.st-fix { background: #a07a1c; } .blk.st-redo { background: #a8342e; } .blk.st-none { background: #111; }
  .blk.first { border-left: 2px solid var(--gold); }
  .blk span { position: absolute; left: 3px; top: 2px; font-size: 10px; color: #e6e6ea; }
  .blk:hover { filter: brightness(1.4); }
  .playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; pointer-events: none; }
  .legend { display: flex; gap: 6px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .legend .blk { display: inline-block; width: 14px; height: 10px; border-radius: 2px; margin-left: 8px; }

  @media (max-width: 900px) {
    .conv { grid-template-columns: 1fr; }
    .conv-side { position: static; }
    .grid2, .grid3, .board { grid-template-columns: 1fr; }
    .scenes { position: static; max-height: 260px; }
    .shot { grid-template-columns: 1fr; }
    .cards { grid-template-columns: 1fr; }
    nav { margin-left: 0; width: 100%; overflow-x: auto; }
    .tab { white-space: nowrap; padding: 7px 9px; }
    .brand { font-size: 0; gap: 0; }
    header select { max-width: 50vw; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts"></div>
<script src="parser.js"></script>
<script src="db.js"></script>
<script src="prompts.js"></script>
<script src="render.js"></script>
<script src="ai.js"></script>
<script src="voice.js"></script>
<script src="sound.js"></script>
<script src="review.js"></script>
<script src="dev.js"></script>
<script src="studio.js"></script>
<script>if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>
